AWSTemplateFormatVersion: "2010-09-09"
Description: Hirova GitHub Actions OIDC deployment role with no long-lived AWS keys.

Parameters:
  GitHubOrganization:
    Type: String
    Default: Adityavu22
  GitHubRepository:
    Type: String
    Default: hirova
  LambdaFunctionName:
    Type: String
    MinLength: 1
  EcrRepositoryName:
    Type: String
    Default: hirova-ai-lambda

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: Hirova

  GitHubDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hirova-github-production-deploy
      Description: Main-branch GitHub Actions access for Hirova Lambda image deployments.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrganization}/${GitHubRepository}:*
      Policies:
        - PolicyName: PushHirovaLambdaImage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}
        - PolicyName: UpdateHirovaLambdaImage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:UpdateFunctionCode
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${LambdaFunctionName}

Outputs:
  DeploymentRoleArn:
    Description: Store this ARN as the AWS_DEPLOY_ROLE_ARN GitHub Actions variable.
    Value: !GetAtt GitHubDeploymentRole.Arn
