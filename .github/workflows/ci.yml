name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: ruff check .
        working-directory: backend
      - run: pytest -q
        working-directory: backend
      - run: python evals/run_evals.py
        working-directory: backend

  containers:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hirova-frontend .
      - run: docker build -t hirova-backend ./backend
      - run: docker build -f backend/Dockerfile.lambda -t hirova-lambda ./backend

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
      - run: sam validate --lint --template-file infra/aws/template.yaml
      - run: sam validate --lint --template-file infra/aws/bootstrap.yaml
      - run: sam validate --lint --template-file infra/aws/github-actions.yaml

  deploy-aws:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [frontend, backend, containers, infrastructure]
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: hirova-production-aws
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Verify GitHub OIDC claims
        shell: bash
        run: |
          response=$(curl --fail --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          token=$(jq --raw-output '.value' <<< "$response")
          TOKEN="$token" python - <<'PY'
          import base64
          import json
          import os

          payload = os.environ["TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(json.dumps({"aud": claims.get("aud"), "sub": claims.get("sub")}))
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      - uses: docker/setup-buildx-action@v3
      - name: Build and push Lambda image
        env:
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --file backend/Dockerfile.lambda \
            --tag "${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${IMAGE_TAG}" \
            --push backend
      - name: Deploy immutable image digest to Lambda
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          digest=$(aws ecr describe-images \
            --repository-name "${{ vars.ECR_REPOSITORY }}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --image-uri "${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${digest}" \
            --no-cli-pager >/dev/null
          aws lambda wait function-updated-v2 --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}"
          aws lambda get-function \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --query 'Configuration.[State,LastUpdateStatus]' \
            --output text
